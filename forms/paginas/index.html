<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Desafios de Validação</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>Validação de senha</h2>

<form onsubmit="validarSenha(); return false;">
    Senha:
    <input type="password" id="senha1">

    Confirmar Senha:
    <input type="password" id="senha2">

    <button type="submit">Validar Senha</button>
</form>

<p id="mensagemSenha"></p>

<hr>

<h2>Promoção especial</h2>

<form onsubmit="verificarPromocao(); return false;">
    Idade:
    <input type="number" id="idadePromocao">

    É estudante?
    <select id="estudante">
        <option value="nao">Não</option>
        <option value="sim">Sim</option>
    </select>

    <button type="submit">Verificar Desconto</button>
</form>

<p id="mensagemPromocao"></p>

<hr>

<h2>Bouncer do sistema</h2>

<form onsubmit="verificarEntrada(); return false;">
    Nome:
    <input type="text" id="nome">

    Idade:
    <input type="number" id="idade">

    <button type="submit">Entrar</button>
</form>

<p id="mensagemBouncer"></p>

<script src="../Scripts/script.js"></script>

</body>
</html>
